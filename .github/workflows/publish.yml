name: Publish GitHub Package

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release tag must be a NuGet version such as v0.1.0 or v0.2.0-rc.1" >&2
            exit 1
          fi
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: dotnet restore CreateOS.Sandbox.sln
      - run: dotnet format CreateOS.Sandbox.sln --verify-no-changes --no-restore
      - name: Build solution
        run: dotnet build CreateOS.Sandbox.sln --configuration Release --no-restore -p:Version="$PACKAGE_VERSION"
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
      - run: dotnet test CreateOS.Sandbox.sln --configuration Release --no-build
      - name: Pack SDK
        run: dotnet pack src/CreateOS.Sandbox/CreateOS.Sandbox.csproj --configuration Release --no-build --no-restore -p:Version="$PACKAGE_VERSION" --output artifacts
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
            --name github --username "$GITHUB_ACTOR" --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text
          dotnet nuget push "artifacts/CreateOS.Sandbox.${PACKAGE_VERSION}.nupkg" \
            --source github --api-key "$GITHUB_TOKEN" --skip-duplicate
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
