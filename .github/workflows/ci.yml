name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CreateOS.Sandbox.sln
      - run: dotnet format CreateOS.Sandbox.sln --verify-no-changes --no-restore
      - run: dotnet build CreateOS.Sandbox.sln --configuration Release --no-restore
      - run: dotnet test CreateOS.Sandbox.sln --configuration Release --no-build
      - run: dotnet pack src/CreateOS.Sandbox/CreateOS.Sandbox.csproj --configuration Release --no-build --output artifacts
